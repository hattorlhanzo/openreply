# openreply.fessto.ru — legacy host, kept alive for one reason.
#
#   /etc/nginx/sites-available/openreply-legacy + symlink into sites-enabled
#
# The panel, OAuth and the Meta webhook all moved to ig.zetzet.pro. This name
# stays only because ~5 900 direct messages have already gone out with buttons
# pointing at https://openreply.fessto.ru/r/<slug>, and those buttons cannot be
# edited after the fact — Instagram allows no such thing. Retire this vhost and
# every one of those links dies silently, which is exactly how the Beget
# shutdown broke ~500 messages in August.
#
# /r/<slug> resolves the slug in the database and redirects to its destination,
# ignoring the hostname entirely, so pointing this name at the same app is all
# that is required. Clicks keep landing in LinkClick as before.
#
# Its own certificate, deliberately separate from ig.zetzet.pro's: a renewal
# failure here (the domain is registered elsewhere and may lapse) must not be
# able to take the live host's certificate down with it.

server {
    listen 80;
    listen [::]:80;
    server_name openreply.fessto.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openreply.fessto.ru;

    ssl_certificate     /etc/letsencrypt/live/openreply.fessto.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openreply.fessto.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

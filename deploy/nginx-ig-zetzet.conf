# OpenReply — ig.zetzet.pro on the shared SPb box.
#
#   /etc/nginx/sites-available/openreply  + symlink into sites-enabled
#
# This box also serves an unrelated CRM. Nothing here may claim default_server
# or touch port 3000, which the CRM owns; OpenReply is published on 3100.
#
# http2 is deliberately absent. A browser pulls the dashboard's chunks over one
# multiplexed connection, and DPI on some Russian networks resets it —
# ERR_HTTP2_PING_FAILED, page stuck on skeletons forever, while sequential curl
# keeps working. HTTP/1.1 gives each file its own connection.

map $http_upgrade $openreply_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ig.zetzet.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ig.zetzet.pro;

    ssl_certificate     /etc/letsencrypt/live/ig.zetzet.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ig.zetzet.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    # Meta signs the webhook body with HMAC over the exact bytes it sent.
    # Nothing here may rewrite, buffer-and-reassemble, or re-encode the body,
    # or every signature check fails with a 401 and no comment is ever seen.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $openreply_connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
